[project]
name = "be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdalhameed Ahmed", email = "abdalhameed.med@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.5.2",
    "langgraph>=1.2.11",
    "openai>=3.3.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "sqlalchemy>=2.0.52",
    "tiktoken>=0.14.0",
]

[project.scripts]
be = "be:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
